name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build windows --release

      - name: Zip release bundle
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath rssg_agent_desktop-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: rssg_agent_desktop-windows
          path: rssg_agent_desktop-windows.zip
          retention-days: 30
